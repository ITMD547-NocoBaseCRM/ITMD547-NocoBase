# Parlournoco Azure deployment trigger
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Parlournoco

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build
        run: |
          npm install
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_49BACFE8E1A544F6A7C462A71F24BA56 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D5E1880AC0784C3E8ED285C39E7DEFEE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3C06E72F2E1A4D5BA110142419572D31 }}

      - name: Ensure App Service is enabled
        shell: bash
        run: |
          resource_group="$(az webapp list \
            --query "[?name=='Parlournoco'].resourceGroup | [0]" \
            --output tsv)"

          if [ -z "$resource_group" ]; then
            echo "App Service 'Parlournoco' was not found in the authenticated subscription." >&2
            exit 1
          fi

          az webapp update \
            --name Parlournoco \
            --resource-group "$resource_group" \
            --set enabled=true

          enabled="$(az webapp show \
            --name Parlournoco \
            --resource-group "$resource_group" \
            --query enabled \
            --output tsv)"

          if [ "$enabled" != "true" ]; then
            echo "App Service remains disabled." >&2
            exit 1
          fi

          az webapp start \
            --name Parlournoco \
            --resource-group "$resource_group"

      - name: Configure App Service startup
        shell: bash
        run: |
          resource_group="$(az webapp list \
            --query "[?name=='Parlournoco'].resourceGroup | [0]" \
            --output tsv)"

          if [ -z "$resource_group" ]; then
            echo "App Service 'Parlournoco' was not found in the authenticated subscription." >&2
            exit 1
          fi

          az webapp config appsettings set \
            --name Parlournoco \
            --resource-group "$resource_group" \
            --settings \
              APP_ENV=production \
              APP_PORT=8080 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true

          az webapp config set \
            --name Parlournoco \
            --resource-group "$resource_group" \
            --startup-file "npm start"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Parlournoco'
          slot-name: 'Production'
          package: .
          
