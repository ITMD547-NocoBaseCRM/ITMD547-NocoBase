name: Deploy NocoBase to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ec2-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/parlour-crm/app
            git pull --ff-only origin main
            sudo docker compose -f docker-compose.ec2.yml up -d --build
            sleep 15
            test "$(sudo docker inspect -f '{{.State.Status}}' app-nocobase-1)" = "running"
            curl --fail --silent --show-error --max-time 15 http://127.0.0.1:13000/ >/dev/null
